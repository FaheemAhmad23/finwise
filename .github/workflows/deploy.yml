name: 🚀 Deploy FinWise

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 🌐 Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Install Node.js on server (if needed)
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT || 22 }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} bash << 'EOF'
            set -e
            if ! command -v node &>/dev/null; then
              echo "Installing Node.js 20..."
              curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
              apt-get install -y nodejs
            fi
            if ! command -v pm2 &>/dev/null; then
              echo "Installing pm2..."
              npm install -g pm2
            fi
            echo "Node $(node -v) | npm $(npm -v) | pm2 $(pm2 -v)"
          EOF

      - name: Pull code and build
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT || 22 }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} bash << 'EOF'
            set -e
            export PATH="/usr/bin:/usr/local/bin:$PATH"

            # Clone repo if first time
            if [ ! -d /root/finwise ]; then
              git clone https://github.com/TheMalikFaheem/finwise.git /root/finwise
            fi

            cd /root/finwise
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm install --legacy-peer-deps

            echo "Building..."
            npm run build

            echo "Build complete!"
          EOF

      - name: Write env and restart app
        run: |
          ssh -i ~/.ssh/deploy_key \
              -p ${{ secrets.SSH_PORT || 22 }} \
              -o StrictHostKeyChecking=no \
              ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
              "export PATH=/usr/bin:/usr/local/bin:\$PATH && \
               printf 'DATABASE_URL=%s\nNEXTAUTH_SECRET=%s\nNEXTAUTH_URL=%s\n' \
                 '${{ secrets.DATABASE_URL }}' \
                 '${{ secrets.NEXTAUTH_SECRET }}' \
                 '${{ secrets.NEXTAUTH_URL }}' \
               > /root/finwise/.env && \
               cd /root/finwise && \
               (pm2 restart finwise 2>/dev/null || pm2 start npm --name finwise -- start) && \
               pm2 save && \
               (pm2 startup 2>/dev/null || true) && \
               echo Done"

      - name: Summary
        if: success()
        run: |
          echo "### Deploy Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "URL: http://${{ secrets.SSH_HOST }}:3000" >> $GITHUB_STEP_SUMMARY

      - name: Failed
        if: failure()
        run: echo "### Deploy Failed - check logs above" >> $GITHUB_STEP_SUMMARY
