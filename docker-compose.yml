
services:
  # ── MySQL Database ───────────────────────────────────────────────────────────
  db:
    image: mysql:8
    container_name: finwise_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      finwise_db
      MYSQL_USER:          finwise_user
      MYSQL_PASSWORD:      ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"       # Internal only — do NOT expose publicly
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "finwise_user", "--password=${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s   # Give MySQL time to initialize on first run

  # ── FinWise Next.js App ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finwise_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # MySQL connection string (uses internal Docker hostname 'db')
      DATABASE_URL: mysql://finwise_user:${DB_PASSWORD}@db:3306/finwise_db

      # NextAuth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL:    ${NEXTAUTH_URL}

      # Optional: Google OAuth
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      NODE_ENV: production
    ports:
      - "3000:3000"       # App accessible at http://YOUR_IP:3000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mysql_data:
    driver: local
